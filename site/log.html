<head>

<title>Changelog — Create-Equip Command Builder</title>
<style>
:root{color-scheme:dark;--bg:#12151b;--card:#1b2029;--text:#e6e9ef;--muted:#98a1b0;--border:#2d3441;--accent:#5b8dff;--accent-text:#0b0f16}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
a.back{color:var(--muted);font-size:.85rem;text-decoration:none}
a.back:hover{color:var(--text);text-decoration:underline}
h1{font-size:1.4rem;margin:14px 0 4px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--border);padding:16px;margin-bottom:16px}
input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-size:.9rem;font-family:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.cl-search{width:100%;max-width:340px;margin-bottom:14px;box-sizing:border-box}
.cl-date{font-weight:700;color:var(--text);font-size:.95rem;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.cl-date:first-child{margin-top:0;padding-top:0;border-top:0}
.cl-ver{font-weight:600;color:var(--muted);font-size:.82rem;margin-top:10px}
.cl-ver:first-child{margin-top:6px}
.cl-tag{font-weight:600;font-size:.68rem;padding:1px 5px;margin-left:6px;border:1px solid var(--border);color:var(--muted)}
.cl-tag.cl-content{color:#46c46e;border-color:#46c46e55}.cl-tag.cl-feature{color:#5b8dff;border-color:#5b8dff55}.cl-tag.cl-fix{color:#f5b301;border-color:#f5b30155}
.game-ver{display:inline-block;font-size:.8rem;font-weight:600;color:var(--text);border:1px solid var(--border);padding:2px 8px;margin:0 0 12px}
.cl-list{margin:3px 0 0;padding-left:18px;color:var(--muted);font-size:.84rem;line-height:1.5}
.cl-list li{margin-bottom:2px}
.cl-empty{color:var(--muted);font-size:.9rem;padding:12px 0}
/* theme v7 "Polish" (same as the other pages) */
@font-face{font-family:Rajdhani;src:url(assets/fonts/rajdhani-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Rajdhani;src:url(assets/fonts/rajdhani-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Rajdhani;src:url(assets/fonts/rajdhani-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--bg:#10131a;--card:#181d27;--card2:#1f2532;--text:#e8ebf1;--muted:#97a0b0;--border:#2a3140;--accent:#5b8dff}
html,body{font-family:Inter,system-ui,"Segoe UI",sans-serif}
body{background:radial-gradient(1200px 520px at 75% -120px,#22304f 0,transparent 65%) no-repeat,var(--bg)}
h1{font-family:Rajdhani,Inter,sans-serif;font-size:2.3rem;font-weight:700;line-height:1.05}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border-color:var(--border);border-radius:14px;box-shadow:0 20px 40px -26px #000}
input{border-radius:9px;background:#121620}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #5b8dff33}
.cl-date{font-family:Rajdhani,Inter,sans-serif;font-size:1.15rem}
.cl-tag{border-radius:999px;padding:1px 7px}
.game-ver{border-radius:999px;background:#1a2235;border-color:#3b4a6b;color:#c7d3ef}
a.back{color:var(--accent)}
main{max-width:min(1800px,calc(100vw - 32px))}
</style>

<body>
<main>
  <a class="back" href="./">&larr; Back to the .zon Builder</a>
  <h1>Changelog</h1>
  <div class="game-ver">Game data version: 3.4.3 beta</div>
  <p class="sub">Every change made to this site, newest first. Search by date (e.g. "10/31", "Oct 29", "2026-10-24"), version number, tag (Content / Feature / Fix), or keyword.</p>
  <div class="card">
    <input type="text" id="clSearch" class="cl-search" placeholder="Search by date or keyword&hellip;">
    <div id="changelogList"></div>
  </div>
</main>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const GAME_VERSION="3.4.3 beta";
const CHANGELOG=[
  {date:"2026-11-20",ver:"7.2.1",tag:"Fix",items:["Updated to the newer remielle.exe's names, so Equip writes what the new server accepts: Kafka and Robin are \"Avatar_Female_Size03_Kafka_En\" and \"Avatar_Female_Size02_Robin_En\" in the .zon (the site still shows Kafka and Robin), Elegy of the Spider Molt is Requiem Araneae, Starflow Spectrum is Iridescent Starsong, and the disc sets Crimson Wing Nocturne and Rank Stele are Bloodwing Nocturne and Monument of the Star (all six pieces now written \"Name [n]\").", "The built-in player file and the Check file tab use the new names too."]},
  {date:"2026-11-20",ver:"7.2.0",tag:"Feature",items:["New Skin setting in the Builder's Character section, next to Mindscape: \"No skin (0)\" or one of that character's skins (shown by number and skin_id - remielle.exe has no skin names). It only shows for characters with skins.", "Equip writes .skin_id into the .zon (0 = no skin) and adds .skin_id / .form = null to characters that don't have those lines yet (the newer Remielle needs both). It's saved with the build and shows on the build card (\"Skin 3111911\")."]},
  {date:"2026-11-19",ver:"7.1.1",tag:"Content",items:["Rina (Alexandrina Sebastiane): Core Skill added. A-C +4.8% PEN Ratio each, D-F +25 ATK each (14.4% PEN Ratio and +75 ATK at core F)."]},
  {date:"2026-11-19",ver:"7.1.0",tag:"Feature",items:["New Potential setting in the Builder's Character section, under Mindscape (0-6). It only shows for the 13 characters that have Potential: Neko, Soldier 11, Koleda, Lycaon, Burnice, Grace, Ellen, Harumasa, Rina, Jane, Vivian, Soldier 0 - Anby and Ju Fufu.", "Equip writes it into the .zon (.awake = .{ .level = N, .enabled = true }; 0 = off). It's saved with the build and shows on the build card (\"Potential N\"). Other characters' awake line is left as it is. Stats don't change with Potential."]},
  {date:"2026-11-19",ver:"7.0.5",tag:"Fix",items:["Build card: the green +numbers (how much gear and Core add on top of the base stat) now only show with Dev tools on, and so does their line in How to read. Without them the stat values are shorter and the stat names stop wrapping."]},
  {date:"2026-11-19",ver:"7.0.4",tag:"Fix",items:["Undid the 7.0.3 build card change: its stats are two columns again, exactly as before. Stat numbers are back to their original size (7.0.0 had made them bigger).", "The site is wider instead: pages and the Builder / .zon editor / Teams areas now go up to 1800px (were 1400px), so the build card has more room."]},
  {date:"2026-11-19",ver:"7.0.3",tag:"Fix",items:["Build card: stat names no longer break onto two lines when a value is long (e.g. CRIT Rate next to \"91.3% | 51.3% +46.3%\"). The build card is wider on the Builder tab, and its stats are now one list in the game's order (HP, ATK, DEF, Impact, CRIT Rate, CRIT DMG, Anomaly Mastery, Anomaly Proficiency, PEN Ratio, Energy Regen) instead of two squeezed columns."]},
  {date:"2026-11-19",ver:"7.0.2",tag:"Fix",items:["Every page now uses the full width (up to 1400px, the same as the Builder's cards) instead of a narrow column, so the title, the page switch and the tabs line up with the cards under them."]},
  {date:"2026-11-19",ver:"7.0.1",tag:"Fix",items:["Card headings are no longer all caps, so the Drive Disc heading now shows the game's own capitals (\"Drive Disc\")."]},
  {date:"2026-11-19",ver:"7.0.0",tag:"Feature",items:["New look: same navy and blue colors with more depth - rounded cards with soft shadows, a glow at the top of the page, the two pages (.zon Builder / Guides) as one switch and the tabs under it as an underlined row, rounded buttons and fields, and an ice-blue glow behind the character on the build card.", "New fonts, built into the site so they also work offline in the app: Rajdhani for headings, tabs and stat numbers, Inter for everything else.", "The changelog page has the same look."]},
  {date:"2026-11-18",ver:"6.11.0",tag:"Feature",items:["Remielle commands moved out of the top bar. It's now its own page, opened from the \"Remielle commands\" link next to the version number at the top (the same way the changelog opens). The top bar has .zon Builder and Guides."]},
  {date:"2026-11-17",ver:"6.10.3",tag:"Content",items:["Added level-60 base stats for 37 characters, read straight from remielle.exe: Anby, Neko, Nicole, Caesar, Billy, Koleda, Anton, Ben, Soukaku, Lycaon, Lucy, Lighter, Burnice, Grace, Harumasa, Rina, Yanagi, Qingyi, Jane, Seth, Piper, Hugo, Orphie & Magus, Evelyn, Zhao, Pulchra, Trigger, Yixuan, Ju Fufu, Alice, Ye Shunguang, Manato, Aria, Cissia, Pyrois, Phoenix and Robin. The same exe data matched 244 of 245 stats already confirmed in game. Gold highlights on these cards aren't set yet."]},
  {date:"2026-11-17",ver:"6.10.2",tag:"Content",items:["Removed the Sharp DMG Bonus row and Crimson Wing Nocturne's squad Sharp DMG buff. Sharp DMG works like Anomaly Buildup, which the site doesn't track either."]},
  {date:"2026-11-17",ver:"6.10.1",tag:"Fix",items:["Teams: squad buffs from a character's own W-Engine and 4pc set now apply to that character too (\"all squad members\" includes the wearer), unless their own card already counts them. Dialyn now gets the +8% Sharp DMG from her own Crimson Wing Nocturne, and Lucia gets the +25% DMG from her own Dreamlit Hearth."]},
  {date:"2026-11-17",ver:"6.10.0",tag:"Feature",items:["New Check file tab on the .zon page. It checks a whole .zon the way Remielle does before you pack it: syntax errors with line:column like the server (and finds the real cause of a missing },), character, W-Engine and disc names against Remielle's own lists (taken from remielle.exe: 65 characters, 109 W-Engines, 348 disc names), and its rules (refine, Mindscape tab state, rank/level, disc slots and main stats, substats, Potential). Fix buttons and Fix all for missing }, and commas, disc spelling, refine, substat +, missing null substats or slots, and Mindscape tabs. Use fixed file in the .zon editor sends the result straight to the editor."]},
  {date:"2026-11-17",ver:"6.9.0",tag:"Feature",items:["The .zon Builder tab's Build card now has the Drive Disc Set under it, so you can see and manage the discs you've added while building. It moves back under the card in the .zon editor tab."]},
  {date:"2026-11-17",ver:"6.8.0",tag:"Feature",items:["The experimental layout is now the only layout on every page. The Experimental layout switch is gone."]},
  {date:"2026-11-17",ver:"6.7.0",tag:"Feature",items:["The .zon Builder tab now shows the Build card (stat card) next to the builder, wider than the page column. It stays in view while you scroll and updates live as you change things. The same card still shows in the .zon editor tab."]},
  {date:"2026-11-17",ver:"6.6.4",tag:"Fix",items:["Disc names now match the server's spelling per slot. Crimson Wing Nocturne slots 2 and 6 and Rank Stele slots 1, 2 and 6 have no space before the bracket (e.g. \"Crimson Wing Nocturne[2]\"). If your loaded .zon only uses one spelling for a slot, the site follows the file."]},
  {date:"2026-11-17",ver:"6.6.3",tag:"Fix",items:["Empty substat slots on a disc are now written as null in the .zon (.@\"2\" = null, and so on), so discs with fewer than 4 substats, or none, equip without breaking the file. The 'needs at least one substat' block is gone."]},
  {date:"2026-11-17",ver:"6.6.2",tag:"Fix",items:["The .zon editor won't equip a disc with no substats anymore (the game file breaks on it). It shows 'needs at least one substat' for that slot instead. The test file's Crimson Wing discs now have substats."]},
  {date:"2026-11-17",ver:"6.6.1",tag:"Fix",items:["Yuzuha's two AM-over-100 squad buffs now say what each one gives: one is Attribute Anomaly DMG, the other is Disorder DMG."]},
  {date:"2026-11-17",ver:"6.6.0",tag:"Feature",items:["Import saves (.json) now also brings in teams when the file has them, linked to the builds in the same file. Added zzz_test_teams.json: 4 test teams (12 builds, all named TEST) for checking the team math against the game."]},
  {date:"2026-11-17",ver:"6.5.5",tag:"Fix",items:["In-combat Max HP% buffs on a character's own card (like Lucia's Ether Veil 5% and Dreamlit Hearth 15%) now multiply her whole initial Max HP, not just base HP. Lucia: 23,902 \u00d7 1.20 = 28,682, matching the game."]},
  {date:"2026-11-17",ver:"6.5.4",tag:"Fix",items:["Teams: Max HP and ATK a character gains from the squad now also turn into Sheer Force (Rupture rule: 0.1 per HP, 0.3 per ATK). Banyue with Dialyn and Lucia now matches the game: +445 SF from the +4,450 HP."]},
  {date:"2026-11-17",ver:"6.5.3",tag:"Fix",items:["Squad Max HP% buffs in Teams now add up and multiply the whole initial Max HP, not just base HP. Banyue with Lucia's Ether Veil (5%) and Dreamlit Hearth W1 (15%): 22,253 \u00d7 1.20 = 26,703, matching the game."]},
  {date:"2026-11-17",ver:"6.5.2",tag:"Fix",items:["Lucia's Darkbreaker squad Sheer Force no longer rounds Max HP \u00f7 200 down. 23,902 Max HP now gives 896.4, matching the game."]},
  {date:"2026-11-17",ver:"6.5.1",tag:"Fix",items:["The .zon block now updates the instant you change anything in the Builder (it used to lag up to half a second), and it always refreshes right before a button reads it, so a quick Equip or Copy never misses the W-Engine."]},
  {date:"2026-11-17",ver:"6.5.0",tag:"Feature",items:["New Sharp DMG Bonus row (shows only when something adds to it). Crimson Wing Nocturne 4pc is now counted in Teams: when the wearer is a Stun character, all squad members get Sharp DMG +8%."]},
  {date:"2026-11-17",ver:"6.4.0",tag:"Feature",items:["Teams now count squad buffs from W-Engines and 4-piece disc sets too, using the giver's real W-Engine refine (W1\u2013W5) and their 4pc set. W-Engines: Tusks of Fury, Ice-Jade Teapot, Elegant Vanity, Half-Sugar Bunny, Roaring Fur-nace, Metanukimorphosis, Dreamlit Hearth, Yesterday Calls, Thoughtbop, Neon Fantasies, Joyau Dore, Ode of Resurrected Wings, Roxy's W-Engine, Robin Test Engine. 4pc sets: Swing Jazz, Proto Punk, King of the Summit (Stun equipper, +15% more at 50%+ CRIT Rate), Moonlight Lullaby (Support equipper), Bunny in Wonderland (Defense equipper, 3 stacks). Each one shows in blue on the teammates' cards, and in Dev tools' Math box.", "Left out as too specific: Astral Voice (only the character entering via Quick Assist), Crimson Wing Nocturne (Sharp DMG has no row), and buffs that only help the equipper."]},
  {date:"2026-11-17",ver:"6.3.0",tag:"Feature",items:["New Dev tools switch, in the Player card next to Experimental layout and remembered in your browser. When it's on, every team member card shows a Math box with each teammate buff worked out step by step (e.g. Astra Yao: 35% \u00d7 715 initial ATK = 250 ATK (cap 1,200)), plus why their Additional Ability is ON or OFF (which teammates match the requirement)."]},
  {date:"2026-11-16",ver:"6.2.0",tag:"Feature",items:["New Teams tab on both the .zon Builder and Remielle commands pages. Put 3 saved builds together. Each member's stat card adds the buffs the other two give them, in blue with who it's from (e.g. +40% DMG from Dialyn, Darkbreaker Sheer Force from Lucia's HP). Additional Abilities switch on or off based on the team's specialties (shown as ON / OFF / depends on Attribute/Faction), and Remielle's ATK buff uses the team's real Anomaly count. Equip team in .zon puts all 3 builds into the file in one click (each logged); on the commands page, Copy team commands copies all 3 builds' commands. Teams can be edited and deleted.", "Squad buffs in so far: Lucia (Ether Veil HP +5%, +20% DMG, Darkbreaker Sheer Force), Yuzuha (Tanuki Wish ATK and +15% DMG, AM \u2192 Attribute Anomaly/Disorder DMG), Astra Yao (Idyllic Cadenza ATK), Sunna (Angelic Chord-ination ATK), Dialyn (+40% DMG), Soldier 0 - Anby (Aftershocks +25%), Remielle (Anomaly squad ATK)."]},
  {date:"2026-11-16",ver:"6.1.18",tag:"Content",items:["Severian Lowell: Core Skill added. A\u2013C +9.6% CRIT DMG each, D\u2013F +25 ATK each."]},
  {date:"2026-11-16",ver:"6.1.17",tag:"Content",items:["Severian Lowell: his Additional Ability is in. For every 1% CRIT Rate he has, his ATK increases by 8.5, capped at 100% CRIT Rate (+850 ATK). Shown in blue, since it needs a Support or Stun teammate or one from the same faction."]},
  {date:"2026-11-16",ver:"6.1.16",tag:"Content",items:["Sigrid de L'Azur: her Core Passive is in. Activating or refreshing Aerial Patrol Spear gives CRIT Rate +66% for 8s, shown in blue. It's kept as an exception: played right, she's always in this state."]},
  {date:"2026-11-16",ver:"6.1.15",tag:"Content",items:["Sigrid de L'Azur: her Additional Ability is in. ATK +120, plus 12 per character level, up to +840 (the max at Lv 60), shown in blue since it needs a Support or Stun teammate."]},
  {date:"2026-11-16",ver:"6.1.14",tag:"Content",items:["Sunna: her Core Passive is in. Characters in the Angelic Chord-ination state (all squad members, her included) gain ATK equal to 30% of Sunna's initial ATK, up to 1,050, shown in blue."]},
  {date:"2026-11-16",ver:"6.1.13",tag:"Content",items:["Velina Airgid: her Additional Ability is in. Windswept and Vortex DMG +10%, shown in blue in the Windswept and Vortex DMG Bonus rows (it needs an Anomaly teammate or one with the same attribute)."]},
  {date:"2026-11-16",ver:"6.1.12",tag:"Content",items:["Astra Yao: her Core Passive is in. During Idyllic Cadenza, she and the incoming character gain ATK equal to 35% of Astra's initial ATK, up to 1,200, shown in blue on her card."]},
  {date:"2026-11-16",ver:"6.1.11",tag:"Content",items:["Soldier 11: her Additional Ability is in. With a teammate of the same Attribute or Faction she deals 10% more Fire DMG, shown in blue as Fire DMG Bonus +10%. The extra +22.5% against Stunned enemies is left out (enemy state)."]},
  {date:"2026-11-16",ver:"6.1.10",tag:"Content",items:["Roxy: added her saved-build banner image. Her Additional Ability (Anomaly Buildup Rate) and her Core Passive's squad CRIT DMG / Laceration buff from Contamination or Cleanse are left out as too specific."]},
  {date:"2026-11-16",ver:"6.1.9",tag:"Content",items:["Saved every Additional Ability squad requirement word for word for the 28 characters with base stats (e.g. Banyue: when another character in your squad is a Support or Stun character). Each build card now shows its character's requirement under the stats. Kafka's and Sunbringer's are marked * (not 100% sure yet). The team maker will use these to switch Additional Abilities on and off."]},
  {date:"2026-11-16",ver:"6.1.8",tag:"Content",items:["Dialyn: her Overwhelmingly Positive DMG +40% is now labeled as her Additional Ability, which only works when another squad member is an Attack or Rupture character."]},
  {date:"2026-11-16",ver:"6.1.7",tag:"Content",items:["Dialyn: \"all squad members gain the Overwhelmingly Positive effect. While Overwhelmingly Positive is active, DMG dealt is increased by 40%\" is in, as a blue DMG Bonus +40% on her own card (she's a squad member too)."]},
  {date:"2026-11-16",ver:"6.1.6",tag:"Fix",items:["Removed the icon from triggered bonuses. They're now marked by the blue color alone."]},
  {date:"2026-11-16",ver:"6.1.5",tag:"Fix",items:["Triggered bonuses now use \u2728 instead of \ud83d\udd39."]},
  {date:"2026-11-16",ver:"6.1.4",tag:"Fix",items:["Triggered bonuses now use a blue diamond \ud83d\udd39 instead of the \u26a1 lightning bolt, to match their new blue color."]},
  {date:"2026-11-16",ver:"6.1.3",tag:"Fix",items:["Triggered (\u26a1) bonuses now show in blue instead of gold everywhere: stat values, stat source pills and the How to read key. Gold is left for the game's own highlighted stats."]},
  {date:"2026-11-16",ver:"6.1.2",tag:"Content",items:["Seed: her Core Passive is in. When the Vanguard unleashes an EX Special Attack, Seed gains Onslaught status: ATK +1,000 and CRIT DMG +30%, shown grayed and marked \u26a1."]},
  {date:"2026-11-16",ver:"6.1.1",tag:"Content",items:["Seed: Lv 60 base stats added (Base HP 7673, Base ATK 854, Base DEF 612, Base Impact 93, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 94, Anomaly Proficiency 93, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, CRIT Rate and CRIT DMG highlighted like in game, plus her saved-build banner image. Core Skill: A\u2013C +9.6% CRIT DMG each, D\u2013F +25 ATK each."]},
  {date:"2026-11-15",ver:"6.1.0",tag:"Feature",items:["New version rules: a redesign or a change to how saves/files are stored bumps MAJOR (6.0.0 \u2192 7.0.0), a new Feature (tool, tab or section) bumps MINOR (6.0.18 \u2192 6.1.0), and Fixes and Content (bug fixes, stats, pictures, text) bump PATCH (6.1.0 \u2192 6.1.1). Older version numbers stay as they were.", "The version in the header now always shows the newest changelog version (it was stuck on v5.1.0-draft)."]},
  {date:"2026-11-15",ver:"6.0.18",tag:"Feature",items:["Removed the Changelog button from the top menu (next to .zon Builder, Remielle commands and Guides). The changelog is still one click away from the version number in the header."]},
  {date:"2026-11-15",ver:"6.0.17",tag:"Fix",items:["Changelog: every change now gets its own entry with the date it was made and its own version number, instead of everything being added to the 5.1.0-draft entry dated Nov 7. The changes from Nov 13\u201315 were split into their own entries (5.1.1\u20136.0.16).", "Fixed a bug where recent changelog lines were showing up under every entry instead of in their own."]},
  {date:"2026-11-15",ver:"6.0.16",tag:"Fix",items:["Guides: fixed spelling, capitalization and punctuation in \"(New) Remielle\" and \"How to edit characters\". The meaning is unchanged and the code examples weren't touched. Also fixed the broken .id = .{ .name = \"Bunny in Wonderland [1]\", \u2026 } example, which now shows as a proper code box."]},
  {date:"2026-11-15",ver:"6.0.15",tag:"Content",items:["Guides \u2192 How to edit characters: added the full finished example at the bottom (\"in total this is what it would look like\": Soldier 0 - Anby with Severed Innocence and 4pc Bunny in Wonderland / 2pc Freedom Blues)."]},
  {date:"2026-11-15",ver:"6.0.14",tag:"Feature",items:["Guides: new How to edit characters section (word for word). It covers every part of a character in the .zon: name, level, rank, favorite, unlocked Mindscape, Mindscape tab state, weapon, equipment/discs and awake (Potential), with the code examples in code boxes."]},
  {date:"2026-11-15",ver:"6.0.13",tag:"Feature",items:["Guides: the Eldreda section was replaced by (New) Remielle, the install guide for the new Remielle server emulator (CovenantOfDayat remielle + thaumiel, prebuilt or git + zig 0.17, client 3.4.0+, print-player / pack-player, re-log after every edit)."]},
  {date:"2026-11-15",ver:"6.0.12",tag:"Feature",items:["Guides: Remielle install and all the command tutorials (making discs, character Mindscapes, W-Engines, Deadly Assault) are now in one big Remielle commands dropdown, closed by default, at the very bottom of the page. Search still finds things inside it and opens it automatically."]},
  {date:"2026-11-15",ver:"6.0.11",tag:"Feature",items:["Mass editing in the .zon Builder:", "Saved builds: every saved build has a checkbox. Equip selected puts all ticked builds into the file at once, and there are Select all / Select none buttons. If two builds are for the same character, the later one wins and you get a warning.", "What's in the file: checkboxes on every character, plus a select-all box for everything shown (works with Find). Bulk actions for the ticked characters: Set Mindscape (M0\u2013M6), Set refine (W1\u2013W5, only characters with a W-Engine), Set level, Unequip all gear (asks for a second click) and Clear selection.", "Every bulk change is written to the Change log, with exactly what changed per character."]},
  {date:"2026-11-15",ver:"6.0.10",tag:"Feature",items:["What's in the file tab: the Change log is now its own card next to the \"What's in the file\" card (side by side, wider than the page column; stacked on phones)."]},
  {date:"2026-11-15",ver:"6.0.9",tag:"Feature",items:[".zon editor: new Change log that records every change to the file with date and time: Equipped (exactly what changed: Mindscape, level, W-Engine + refine, each disc slot, substats, shown before \u2192 after), Hand edit, Removed inventory discs, Undo all equips, Imported file and Downloaded. It lives at the top of the What's in the file tab. It's saved in your browser (last 500), and can be downloaded as a .txt or cleared (two clicks)."]},
  {date:"2026-11-15",ver:"6.0.8",tag:"Feature",items:[".zon: ready for disc sets whose name has no space before the slot (e.g. Name[1] instead of Name [1]). Reading a file now accepts both. There's a list for writing them that way, empty until we know which sets need it."]},
  {date:"2026-11-15",ver:"6.0.7",tag:"Feature",items:[".zon block: new Edit block toggle. Turn it on to type straight into the black box (it gets a yellow outline and stops auto-updating), then click Apply edits to file. It checks that the block starts with .{ + .name, that the braces match, and that the character exists. Turn the toggle off to throw away the edits."]},
  {date:"2026-11-15",ver:"6.0.6",tag:"Feature",items:[".zon editor: Saved builds is now its own full-width card under both boxes, with saves laid out 2 per row (1 per row on phones). The .zon block grows to fill its box, so both top boxes always end at the same height with no empty space."]},
  {date:"2026-11-15",ver:"6.0.5",tag:"Feature",items:[".zon editor: removed the empty space. The two boxes no longer stretch to match each other, the Saved builds list scrolls after about 420px, and the .zon block is a little shorter, so with a full disc set both boxes end at about the same height."]},
  {date:"2026-11-15",ver:"6.0.4",tag:"Feature",items:[".zon editor: now just two boxes. Build card holds the stat card, the build saver and the Drive Disc Set. .zon block holds the block, the file buttons, server commands and Saved builds."]},
  {date:"2026-11-15",ver:"6.0.3",tag:"Feature",items:[".zon editor: the Server commands box is now collapsible (closed by default). Click \"Server commands\" to open it."]},
  {date:"2026-11-15",ver:"6.0.2",tag:"Feature",items:[".zon editor: the separate .zon editor card was merged into the .zon block box. The status line, Equip / Copy / Download / Copy whole file / Undo / Remove inventory discs, the file import and the server commands now sit right under the black box."]},
  {date:"2026-11-15",ver:"6.0.1",tag:"Feature",items:[".zon editor: Saved builds are back. The build saver (Build name + Save current build) sits under the build card, and a second row shows Drive Disc Set and Saved builds (search, import/export, Load into Builder) side by side."]},
  {date:"2026-11-15",ver:"6.0.0",tag:"Feature",items:["Experimental 2 is now the site. The main page is the .zon Builder (tabs: Builder \u00b7 .zon editor \u00b7 What's in the file). The command builder moved to Remielle commands (remielle.html), and Tutorials / Install / Update moved to the searchable Guides page (guides.html). The .zon fixes (.rank always 6, Mindscape in .unlocked_mindscape + tab state) now apply everywhere."]},
  {date:"2026-11-15",ver:"5.1.41",tag:"Content",items:["Added the Rank Stele (343) disc picture. Every disc set now has one."]},
  {date:"2026-11-15",ver:"5.1.40",tag:"Content",items:["Added the Crimson Wing Nocturne (344) disc picture."]},
  {date:"2026-11-15",ver:"5.1.39",tag:"Feature",items:["Remielle .zon: new Remove inventory discs button. It empties the inventory disc list (.equipment_undressed) and keeps every disc equipped on a character. It asks for a second click to confirm, and Undo all equips brings the discs back."]},
  {date:"2026-11-15",ver:"5.1.38",tag:"Feature",items:["Experimental 2: the disc builder no longer shows the \"Drive disc command\" card. \"Add to disc set\" now sits next to \"Reset sub-stats & rolls\"."]},
  {date:"2026-11-15",ver:"5.1.37",tag:"Feature",items:["Experimental 2: the .zon Builder page now opens on the Builder tab with Drive Disc selected."]},
  {date:"2026-11-15",ver:"5.1.36",tag:"Feature",items:["Experimental 2: \"Build card\" and \".zon block\" are now two fully separate cards side by side with a gap, outside the .zon editor card. They can go wider than the page column (up to 1400px), and the page column itself is back to its normal width."]},
  {date:"2026-11-15",ver:"5.1.35",tag:"Feature",items:["Experimental 2: the build card and the .zon block are now two separate boxes, \"Build card\" and \".zon block\", side by side at the top of the .zon editor. The Drive Disc Set sits under them."]},
  {date:"2026-11-15",ver:"5.1.34",tag:"Feature",items:["Experimental 2: \"What's in the file\" (the character table with Find and Load into Builder) moved to its own third tab: Builder \u00b7 .zon editor \u00b7 What's in the file."]},
  {date:"2026-11-15",ver:"5.1.33",tag:"Feature",items:["Experimental 2: in the .zon editor, the .zon block (black box) now sits next to the build card at the same height and scrolls, and the page is wider. On narrow screens it stacks under the card."]},
  {date:"2026-11-15",ver:"5.1.32",tag:"Feature",items:["Remielle .zon: added a \"Server commands\" box with remielle print-player remielle-storage/players/1.bin (creates 1.zon) and remielle pack-player 1.zon --output=remielle-storage/players/1.bin (packs it back into the game's .bin), each with a copy button, placed right above \"What's in the file\". The built-in file now downloads as 1.zon, so you don't have to rename it."]},
  {date:"2026-11-15",ver:"5.1.31",tag:"Fix",items:["Experimental 2: back to tabs. The .zon Builder page has a Builder tab and a .zon editor tab (the separate Builder page was removed). Your edited .zon file and current build still stay loaded when you reload."]},
  {date:"2026-11-15",ver:"5.1.30",tag:"Feature",items:["Experimental 2 (link in the header): the site split into pages to test the new layout before it replaces the current one.", ".zon Builder (default): the Character, Drive Disc and W-Engine builder, with the build card and Drive Disc Set inside a .zon editor card that updates as you build. It has Equip, Download, Copy, Undo, and the \"What's in the file\" table with Load into Builder. No command boxes and no saved builds.", "Remielle commands: the command builder with its Builder and Saved tabs.", "Guides: Tutorials, Eldreda/Remielle install and Update client on one page, with a search box that filters sections and highlights matches.", ".zon format fixes (Experimental 2 only for now): .rank is always 6, the Mindscape goes in .unlocked_mindscape, and .mindscape_tab_state follows the game (M1\u2013M3 fill the first three, M4\u2013M6 clear them and fill the last three).", "Experimental 2: Builder and .zon editor are now separate pages in the top menu, like Remielle commands. The build you make on the Builder page carries over to the .zon editor, and your edited .zon file stays loaded when you switch pages or reload. Load into Builder opens the Builder page with that character filled in."]},
  {date:"2026-11-15",ver:"5.1.29",tag:"Feature",items:["Remielle .zon: new \"What's in the file\" table listing every character in the file with level, Mindscape, equipped W-Engine (W#) and disc sets (x/6). It has a Find box, and edited characters are marked. Load into Builder reads a character's gear from the file into the Builder and Drive Disc Set. Equipping is now an explicit Equip on file button, so opening the tab no longer changes the file by itself. Loading a character and equipping it back unchanged gives a byte-for-byte identical file."]},
  {date:"2026-11-15",ver:"5.1.28",tag:"Feature",items:["Remielle .zon: downloading on the online site now retries as \"player.zon.txt\" if the site won't save a .zon file (rename it back to .zon after). If it's still blocked, the status shows the reason and points to \"Copy whole file\"."]},
  {date:"2026-11-15",ver:"5.1.27",tag:"Fix",items:["Remielle .zon: fixed downloading. The full player file is now built into the page, so Download works even when the site is opened from the zip on your computer. Added a \"Copy whole file\" button as a backup."]},
  {date:"2026-11-15",ver:"5.1.26",tag:"Feature",items:["Remielle .zon: the site now has a built-in full player file (every character, W-Engine and disc), so it can make the whole .zon without importing one. Builds stack: pick one build after another and each is equipped on its character in the same file, then download once. Added an \"Undo all equips\" button. The whole file is always rebuilt with correct braces, so there's no copy-paste and no stray \"},\" at the end of the character list."]},
  {date:"2026-11-14",ver:"5.1.25",tag:"Feature",items:["New Remielle .zon tab. It turns the current build, or any saved build, into the Remielle server's player-file format: rank (Mindscape), W-Engine + refine, and disc slots 1\u20136 with main stat, substats and \"+\" rolls. Import your .zon to equip the build on that character and download the edited file (nothing else in the file changes), or copy just the character block. Character names map to the server's names (Billy, Yinhu, YiXuan\u2026). Severian's, Phoenix's, Kafka's and Robin's W-Engines use the server's names: Incarcerating Grip, Plume of Rebirth, Elegy of the Spider Molt, Starflow Spectrum."]},
  {date:"2026-11-14",ver:"5.1.24",tag:"Fix",items:["Removed Ellen's Flash Freeze Trimming +100% CRIT DMG pill."]},
  {date:"2026-11-14",ver:"5.1.23",tag:"Feature",items:["Added a short \"How to read\" key above the whole build card (and above the card in Full view) explaining \u26a1 gold (combat-only), grey (always on but not in the game menu) and white (in-game menu value)."]},
  {date:"2026-11-14",ver:"5.1.22",tag:"Content",items:["Yuzuha: the second half of Tanuki Wish, \"increases the DMG dealt by those with the effect by 15%\", added as \u26a1 DMG Bonus +15%."]},
  {date:"2026-11-14",ver:"5.1.21",tag:"Content",items:["Yuzuha: every point of Anomaly Mastery over 100 gives +0.2% Attribute Anomaly DMG and +0.2% Disorder DMG (max 20% each at 200 AM), added as grey conversions."]},
  {date:"2026-11-14",ver:"5.1.20",tag:"Content",items:["Soldier 0 - Anby: \"deals 25% more DMG to enemies marked with Silver Star\" added as \u26a1 DMG Bonus +25%."]},
  {date:"2026-11-13",ver:"5.1.19",tag:"Fix",items:["Brought back the anomaly rows (Burn, Shock, Shatter, Assault, Corruption, Windswept, plus Vortex). Attribute Anomaly DMG is added into them again. The skill rows stay removed."]},
  {date:"2026-11-13",ver:"5.1.18",tag:"Fix",items:["Removed the low-use bonus rows: the skill rows (Basic, Dash, Dodge Counter, EX Special, Assist, Assist Follow-Up, Chain, Ultimate) and the single-anomaly rows (Burn, Shock, Shatter, Assault, Corruption, Windswept, Vortex). Kept: DMG, the elements, Lumiflux, Sheer, Abloom, Disorder, Aftershock, Attribute Anomaly, and Laceration. One-move buffs (Ellen's Flash Freeze Trimming +100% CRIT DMG) now show only as a pill in Stat sources and aren't added to the \u26a1 total."]},
  {date:"2026-11-13",ver:"5.1.17",tag:"Content",items:["Lucia: her Core Passive (Darkbreaker) now shows as a \"Gives squad\" line under her stats. It works out the Sheer Force she gives Rupture teammates from her initial Max HP (12 + 7.4 per 200 HP, max 900 at 24,000) and isn't added to her own stats."]},
  {date:"2026-11-13",ver:"5.1.16",tag:"Content",items:["Lucia: \"While Ether Veil: Wellspring is active, all squad members' Max HP increase by 5%\" added as \u26a1 HP +5% (Ether Veil), and Dreamer's Nursery Rhyme \"DMG dealt increases by 20%\" added as \u26a1 DMG Bonus +20%."]},
  {date:"2026-11-13",ver:"5.1.15",tag:"Feature",items:["Added a general DMG Bonus row for buffs that just say \"DMG increases by X%\" with no type. It's listed first in the bonus rows and shows only when something adds to it."]},
  {date:"2026-11-13",ver:"5.1.14",tag:"Content",items:["Ellen: Basic Attack: Flash Freeze Trimming \"the skill's CRIT DMG increases by 100%\" added as \u26a1 CRIT DMG +100%."]},
  {date:"2026-11-13",ver:"5.1.13",tag:"Feature",items:["Added skill DMG Bonus rows: Basic Attack, Dash Attack, Dodge Counter, EX Special Attack (Special counts as EX Special), Assist Attack, Assist Follow-Up, Chain Attack, Ultimate. Shadow Harmony 2pc now also fills Dash Attack +15%, and set 333 2pc gives Basic Attack +15%."]},
  {date:"2026-11-13",ver:"5.1.12",tag:"Content",items:["Ellen: \"subsequent Ice DMG increases by 3% for 10s \u2026 up to 10 times\" added as \u26a1 Ice DMG Bonus +30% at max stacks."]},
  {date:"2026-11-13",ver:"5.1.11",tag:"Content",items:["Soldier 0 - Anby Additional Ability: added \"all squad members' Aftershocks deal 25% more DMG to enemies marked with Silver Star\" (\u26a1 Aftershock DMG Bonus). The CRIT Rate +10% was already on."]},
  {date:"2026-11-13",ver:"5.1.10",tag:"Content",items:["Feathered Fate 4pc: added \"If the equipper is a Lumiflux character, Attribute Anomaly DMG increases by 15%\" (\u26a1, Remielle only)."]},
  {date:"2026-11-13",ver:"5.1.9",tag:"Content",items:["Remielle counts toward her own Additional Ability, so the squad chips are now 1/2/3 (including her). The minimum is 6% initial ATK, and old saves set to 0 now read as 1."]},
  {date:"2026-11-13",ver:"5.1.8",tag:"Feature",items:["Added an Attribute Anomaly DMG Bonus row. It applies to every anomaly, so it's also added into any anomaly row that's showing (Burn, Shock, Shatter, Assault, Corruption, Windswept)."]},
  {date:"2026-11-13",ver:"5.1.7",tag:"Content",items:["Added a Lumiflux DMG Bonus row for Remielle's exclusive attribute."]},
  {date:"2026-11-13",ver:"5.1.6",tag:"Feature",items:["Added anomaly DMG Bonus rows: Burn (Fire), Shock (Electric), Shatter (Ice), Assault (Physical), Corruption (Ether). Windswept (Wind) was already there. They show only when something adds to them."]},
  {date:"2026-11-13",ver:"5.1.5",tag:"Feature",items:["Added Vortex and Windswept DMG Bonus rows, which show only when something adds to them."]},
  {date:"2026-11-13",ver:"5.1.4",tag:"Feature",items:["Laceration DMG on Armorer characters' stat panels is now a calculated stat, so bonuses can be added on top of the base 150%."]},
  {date:"2026-11-13",ver:"5.1.3",tag:"Feature",items:["Added Sheer, Abloom, Disorder and Aftershock DMG Bonus rows next to the elemental ones (they only show when something adds to them). The first source is set 329's 2pc: Aftershock (and Dash Attack) DMG +15%."]},
  {date:"2026-11-13",ver:"5.1.2",tag:"Content",items:["Elemental DMG Bonus rows (Fire, Ice, Electric, Ether, Physical, Wind) now appear under the stat panel, but only when something adds to them: a slot 5 element main stat, a 2pc set like Inferno Metal or Polar Metal, or a passive like Banyue's Fire DMG (grey \u26a1)."]},
  {date:"2026-11-13",ver:"5.1.1",tag:"Content",items:["Banyue Additional Ability (Vidyaraja): Fire DMG +5% per stack, up to 3 stacks (+15%), saved as data along with his Core Passive +36% Fire DMG. It doesn't show yet because there's no Elemental DMG row."]},
  {date:"2026-11-07",ver:"5.1.0-draft",tag:"Feature",items:["New sub-panel in the Update client tab: Errors and solutions. Each entry opens to show when the error happens (optional), the error itself, and the numbered steps that fix it, with a search box. Entries the owner is not sure about get an asterisk (*).", "First confirmed entry: DifferentInterruptedPackage (delete the .zift-work folder inside the zzz directory and try again, or download the updated full client). The 3.3.4 to 3.4.1 update entry is marked with an asterisk for now.", "Tutorials: new Deadly Assault subsection with the two commands for changing the first regular and the first hard mode Deadly Assault option (mod-hadal-entrance boss_challenge_trial_1 and boss_challenge_adversity_1).", "Fixed a doubled \u201chonestly\u201d in the Update client text.", "Added Kafka's portrait art (HD body image and the small face icon used in search and the build card).", "The game data version label is now 3.4.3 beta.", "Added Robin's W-Engine icon (HD icon and small icon). The engine's name is still the placeholder \u201cRobin Test Engine\u201d.", "Added Kafka's W-Engine: Kafka Test W-Engine (ID 14165, the name is a placeholder, S-rank, Anomaly, Kafka exclusive) with its HD and small icons. Its passive text is added word for word at W1 and W5 (the wording differs slightly between the two). Its main stat is Base ATK 713 and its advanced stat is Energy Regen 60%. The passive's name is not added yet.", "Replaced Severian Lowell's Mindscape text (M1\u2013M6) with the game text word for word, replacing an older reworded version (for example Flow, Entry Skill: Clear Out, Basic Attack: Azure Wind's Shadowhunt, Basic Attack: Raging Whirlwind and Windrise).", "Replaced Phoenix's Mindscape text (M1\u2013M6) with the game text word for word. The old reworded version had some wrong details: M2 now says +30% DMG against enemies in the Sear state (was 25%), and names are corrected (Sear, Combustion Attack, Pyre, Soul-Searching Blaze, Basic Attack: Purifying Flame, EX Special Attack: Dazzling Flare).", "Saved tab: each saved build box (the one with Load into Builder, Copy all commands and Delete) can show its character's image behind it at 70% opacity. Each image is tied to its character: Velina Airgid, Dialyn, Promeia, Yidhari Murphy, Ellen Joe, Nangong Yu, Sunna, Claret Flint, Vivian Banshee, Sigrid de L'Azur, Remielle Dan, Hoshimi Miyabi and Norma Hollowell; builds for other characters have no image. The boxes are a little taller (130 px minimum) with the buttons at the bottom, the buttons and opened details are see-through over the image, and saved build names are a little bigger. The images have a sharp dark shadow so they stand out, and all text on those boxes is white (pre-installed builds with an image are no longer faded).", "Saved tab, Drive Disc Set: with New build card on, each staged disc is a card \u2014 the disc image on the left with its slot, the set name, level and main stat value in the middle, and its sub-stats listed on the side with roll counts and totals. The cards are laid out 2\u00d73 (one column on phones). Turning New build card off shows the old list.", "Added Ellen Joe's Lv 60 base stats (in-game order; Base ATK, CRIT Rate and CRIT DMG highlighted) and her Core Skill (F): A, B, C give +4.8% CRIT Rate each and D, E, F give +25 ATK each. She has no conversion.", "Added Hoshimi Miyabi's Lv 60 base stats (in-game order; Base ATK, CRIT Rate and CRIT DMG highlighted) and her Core Skill (F): A, B, C give +30 Anomaly Proficiency each and D, E, F give +25 ATK each.", "Added Nangong Yu's Lv 60 base stats (in-game order; Base ATK, Anomaly Mastery and Anomaly Proficiency highlighted) and her Core Skill (F): A, B, C give +12 Anomaly Mastery each, D, E, F give +25 ATK each, and her Core Skill gives +120 Anomaly Proficiency (shown grayed, as it applies in gameplay but not in the menu number). Conversion: every point of Anomaly Mastery above 110 gives +1 Impact (shown grayed, as it is not in the game menu number).", "Saved tab: every saved build opens a Full view of the whole build \u2014 the full image, then the W-Engine with its stats and passive right under it, then the character's name, mindscape and every stat with all stat sources (no portrait card \u2014 the big image already shows who it is), then all six discs as cards with their sub-stats and set bonuses. Load into Builder and Copy all commands work from inside it; close with \u2715, Close, clicking outside, or Esc. It fits the screen: on wide or full screens it goes flat (image and W-Engine on the left, stats and discs on the right, so most builds fit without scrolling); on narrower screens and phones it stacks into one long column.", "New placeholder image (a silhouette with a question mark) for characters that don't have art yet. It shows on the build card portrait, behind saved builds that have no saved-build image, and in Full view.", "Saved tab: the \u25be drop-down and the Full view button on each saved build are gone. Click anywhere in a saved build's box (except its buttons) to open Full view; the box outline lights up when you hover it.", "Drive Discs are always in slot order no matter what order they were added or saved in, including older saved builds. Where discs show as cards in two columns (Full view and the Builder's new disc cards) they follow the in-game layout \u2014 left column 1, 2, 3 and right column 6, 5, 4, so the rows read 1\u20136, 2\u20135, 3\u20134. On phones (one column) and in the stat sources they go 1 2 3 4 5 6.", "Saved tab: opening Full view is animated \u2014 the saved build's background image comes out of its box, rises from 70% to full opacity and glides smoothly into place as the big image at the top of Full view while the rest of the view fades in around it. The image that moves is the real Full view image (not a copy that gets swapped out), so there's no pop or bump when it lands. Turned off automatically if your device is set to reduce motion.", "Banyue, Severian and Yuzuha now have saved-build banner images (behind their saved builds and at the top of Full view) instead of the placeholder \u2014 every character with base stats now has a banner.", "Saved tab: new \u201cSearch saved builds\u2026\u201d box above your saved builds, styled like the other search boxes. It filters as you type and matches the build name, character (and Mindscape, e.g. m0), W-Engine (name, ID, W level, passive name), every Drive Disc in the build (name, ID, slot), main stats and sub-stats \u2014 e.g. \u201cyunkui\u201d, \u201cvajra\u201d, \u201ccdmg\u201d, \u201cnangong ap\u201d. Esc clears it.", "Velina Airgid: Lv 60 base stats added (Base HP 7788, Base ATK 797, Base DEF 612, Base Impact 86, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 112, Anomaly Proficiency 111, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, Anomaly Proficiency and Base Energy Regen highlighted like in game. Her conversion is in: when her initial Energy Regen exceeds 1.2, every additional 0.01 gives +0.5 Anomaly Mastery, up to +84 \u2014 shown grayed (gameplay, not menu) in the \u201cwith | solid\u201d value and stat sources. The DMG dealt part of the conversion is left out on purpose. Core Skill: A\u2013C +18 Anomaly Proficiency each, D\u2013F +25 ATK each. Checked against her in-game menu with a full build \u2014 HP 12,559, ATK 3,184, DEF 796, CRIT Rate 7.4%, Anomaly Mastery 112, Anomaly Proficiency 401 and Energy Regen 2.88 all match exactly.", "Pan Yinhu: Lv 60 base stats added (Base HP 8453, Base ATK 586, Base DEF 712, Base Impact 94, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 91, Anomaly Proficiency 90, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK highlighted like in game. Core Skill bonuses still to come.", "A-rank W-Engines: info is being added word for word from the game (W1 and W5 exact; W2\u2013W4 filled in evenly between them). Done so far: Candlelit Scheme (13022, renamed from \u201cCandlelight Conspiracy\u201d) \u2014 Base DEF 356, Percent DEF 40%, \u201cMoment of Fright\u201d; Bloodmarrow Coffer (13021) \u2014 Base DEF 356, CRIT Rate 20%, \u201cMoment of Unsealing\u201d; Catty Luck (13017) \u2014 Base DEF 356, Percent DEF 40%, \u201cLucky Pawpad\u201d (its always-on DEF +8\u201312% is grayed: gameplay, not menu); Boisterous Echoes (13018) \u2014 Base ATK 594, Anomaly Proficiency 75, \u201cResounding Drum\u201d; The Simmering Pot (13020) \u2014 Base ATK 594, Impact 15%, \u201cRed Chili Oil Hot Pot\u201d.", "W-Engine passives: the in-between W2\u2013W4 percentages round to one decimal the way the game does (halves round up), e.g. Candlelit Scheme's DMG bonus reads 15% / 17.3% / 19.5% / 21.8% / 24% for W1\u2013W5. Exception: Bloodmarrow Coffer keeps two decimals (0.48% \u2192 0.56% \u2192 0.64% \u2192 0.72% \u2192 0.8%). W1 and W5 stay exactly as written in game.", "W-Engine passives can now hold the game's exact W2, W3 and W4 numbers when they don't fall evenly between W1 and W5. The Simmering Pot uses them: 7.2% / 8.2% / 9.2% / 10.2% / 11.5%.", "Astra Yao: Lv 60 base stats added (Base HP 8609, Base ATK 640, Base DEF 600, Base Impact 83, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 93, Anomaly Proficiency 92, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK and Base Energy Regen highlighted like in game, plus her saved-build banner image. Core Skill: A\u2013C +0.12 Energy Regen each, D\u2013F +25 ATK each.", "Stat view on the cards: Energy Regen always shows two decimals (x.xx) and is cut off, not rounded, like in game \u2014 e.g. 2.496 shows as 2.49; 1.20, 1.56 and 2.88 show as is.", "Roxy: Lv 60 base stats added (Base HP 8418, Base ATK 666, Base DEF 641, Base Impact 100, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 110, Anomaly Proficiency 63, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, CRIT Rate, CRIT DMG and Base Energy Regen highlighted like in game. Her conversion is in: when her initial Energy Regen exceeds 1.2, every 0.01 above gives +5 ATK (up to +960) and +0.4 Impact (up to +76.8) \u2014 shown grayed (gameplay, not menu) in the \u201cwith | solid\u201d values and stat sources. Core Skill: A\u2013C +4.8% CRIT Rate each, D\u2013F +25 ATK each.", "Energy Regen conversions (Velina, Roxy) now count only whole 0.01 steps above 1.2, matching the game's \u201cfor every 0.01\u201d wording.", "Corin Wickes: Lv 60 base stats added (Base HP 6976, Base ATK 732, Base DEF 604, Base Impact 93, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 93, Anomaly Proficiency 96, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, CRIT Rate and CRIT DMG highlighted like in game, plus her saved-build banner image. Core Skill: A\u2013C +9.6% CRIT DMG each, D\u2013F +25 ATK each.", "Sunbringer (Eldreda, Dracaene, and Lindverne): Lv 60 base stats added exactly as the game shows them \u2014 Base HP 5736, Laceration DMG 150% (in place of Base ATK), Base DEF 441, Base Impact 93, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 78, Anomaly Proficiency 77, PEN Ratio 0%, Automatic Sharpness Accumulation 1.5 (in place of Base Energy Regen) \u2014 with Base DEF, CRIT Rate, CRIT DMG and PEN Ratio highlighted like in game. Gear adds to HP, DEF, CRIT, AP and the rest as usual; Laceration DMG and Automatic Sharpness Accumulation stay as shown. Conversion: for every 1% initial CRIT DMG, initial CRIT Rate increases by 0.35% \u2014 counted in the menu number, same as Claret. Core Skill: A\u2013F +4.8% CRIT Rate each (+28.8% total), same as Claret. His +40% CRIT Rate self-buff from using an EX Special Attack is shown grayed (gameplay, not menu).", "4-piece set bonuses now count toward stats when 4+ pieces are equipped. Always-on ones count in the menu number: Rank Stele +12% CRIT Rate, Chaotic Metal +20% CRIT DMG. Stat-based ones are grayed: Crimson Wing Nocturne (CRIT DMG +30% at 50%+ CRIT Rate), Thorned Rose (CRIT Rate +8%/+16% at 1,000/1,800+ initial DEF), Branch & Blade Song (CRIT DMG +30% at 115+ Anomaly Mastery). Triggered ones (need something to happen in combat, shown at max stacks) are grayed and emphasized in gold with \u26a1, both in the stat sources and on the stat itself: Woodpecker Electro, Puffer Electro, Hormone Punk, Thunder Metal, Inferno Metal, Shadow Harmony, Yunkui Tales, White Water Ballad, Branch & Blade Song (Freeze), Chaotic Metal (Corruption stacks), The Sky Ablaze (ATK), Phaethon's Melody, Shining Aria, Notes From the Chained, Wuthering Salon, Feathered Fate. Sunbringer's EX +40% CRIT Rate is marked \u26a1 too.", "Every W-Engine passive and Mindscape was scanned for stat bonuses. Triggered ones are now grayed and marked \u26a1 at max stacks: 28 W-Engines (e.g. Neon Fantasies' +60 AP at 2 stacks, Joyau Dore's +60 AP, Candlelit Scheme's EX CRIT Rate, Catty Luck's EX DEF, The Brimstone's ATK \u00d78, off-field Energy Regen like Hellfire Gears') and Mindscape effects for 22 characters (e.g. Velina M4 +15% ATK, Caesar M6 +30% CRIT Rate/+60% CRIT DMG, Jane M6, Ju Fufu, Sunna M6 CRIT DMG from ATK, Lucia M6 ATK from HP). Always-on Mindscape stat bonuses count in the menu number when the build's Mindscape is high enough (Yidhari M2, Evelyn M2, Soldier 0 - Anby M2, Komano Manato M4, Seed M6, Nangong Yu M4, Promeia M2, Pyrois M1, Sigrid M1, Roxy M1). Half-Sugar Bunny's squad ATK and Max HP are grayed as always-on gameplay bonuses. Stats now follow the build's Mindscape level.", "Chaotic Metal's Corruption stacks (\u26a1 +33% CRIT DMG) now only count for Ether characters (Corruption is the Ether Anomaly) \u2014 Wind, Fire, Ice, Electric and Physical characters like Severian only get its always-on +20% CRIT DMG. The Sky Ablaze's +30% CRIT DMG is now added for Ether characters. Ether characters on the site: Aria, Astra Yao, Nangong Yu, Pyrois, Vivian, Yixuan, Zhu Yuan.", "Dialyn: Lv 60 base stats added (Base HP 8250, Base ATK 683, Base DEF 612, Base Impact 110, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 94, Anomaly Proficiency 93, PEN Ratio 0%, Base Energy Regen 1.2) with CRIT Rate and Base Energy Regen highlighted like in game. Core Skill: A\u2013C +4.8% CRIT Rate each, D\u2013F +25 ATK each. Her conversion is in: if her initial CRIT Rate surpasses 50%, her Impact increases by 2 for each additional 1%, up to +100 \u2014 shown grayed (gameplay).", "Lucia Elowen: Lv 60 base stats added (Base HP 8477, Base ATK 683, Base DEF 594, Base Impact 83, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 96, Anomaly Proficiency 95, PEN Ratio 0%, Base Energy Regen 1.2) with Base HP highlighted like in game, plus her saved-build banner image. Core Skill: A\u2013C +0.12 Energy Regen each, D\u2013F +25 ATK each.", "Soldier 11: Lv 60 base stats added (Base HP 7673, Base ATK 813, Base DEF 612, Base Impact 93, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 94, Anomaly Proficiency 93, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, CRIT Rate and CRIT DMG highlighted like in game, plus her saved-build banner image. Core Skill: A\u2013C +4.8% CRIT Rate each, D\u2013F +25 ATK each.", "Starlight - Billy Kid: Lv 60 base stats added exactly as the game shows them (Base HP 8497, Base ATK 784, Base DEF 445, Base Impact 95, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 90, Anomaly Proficiency 89, Sheer Force 0, Automatic Adrenaline Accumulation 2) with Base HP, CRIT Rate, CRIT DMG and Sheer Force highlighted like in game, plus his saved-build banner image. Core Skill: A\u2013C +4.8% CRIT Rate each, D\u2013F +25 ATK each. As a Rupture character his Sheer Force comes from HP and ATK like Yidhari's. His +90% CRIT DMG from using an EX Special Attack is shown grayed and marked \u26a1 (gameplay, not menu).", "Zhu Yuan: Lv 60 base stats added (Base HP 7482, Base ATK 844, Base DEF 600, Base Impact 90, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 93, Anomaly Proficiency 92, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, CRIT Rate and CRIT DMG highlighted like in game, plus her saved-build banner image. Core Skill: A\u2013C +9.6% CRIT DMG each, D\u2013F +25 ATK each.", "Soldier 0 - Anby: Lv 60 base stats added (Base HP 7673, Base ATK 854, Base DEF 612, Base Impact 93, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 94, Anomaly Proficiency 93, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, CRIT Rate and CRIT DMG highlighted like in game. Plus her saved-build banner image. Core Skill: A\u2013C +4.8% CRIT Rate each, D\u2013F +25 ATK each. Her Additional Ability \u201cSoldier 0 - Anby's CRIT Rate increases by 10%\u201d is shown grayed (gameplay).", "W-Engine passive indicator: a W-Engine's base and advanced stats work on anyone, but its passive only works on a character of the same specialty. The build card, Full view and Builder card now show \u25cf Passive ON (green) when it matches or it's the character's own exclusive, \u25cb Passive OFF \u00b7 needs [specialty] (red) when it doesn't, and ? Passive unknown when a specialty isn't on the site yet. Stats aren't changed by it. Every character on the site now has a specialty Non-exclusive A/B-rank W-Engines have their specialty too (Weeping Cradle and Kaboom the Cannon are linked to Rina and Lucy).", "Nekomiya Mana now has \u201cNeko\u201d as a sub name under her name (like Sunbringer's), so she can be found by searching \u201cneko\u201d. Steel Cushion (Nekomata Exclusive) is linked to her for the passive indicator.", "Sunbringer's W-Engine (ID 14160) now has its real name, Dragonfire Mirage, and its picture (in the W-Engine picker, the build card's W-Engine box and Full view).", "All Mindscape stat bonuses are gameplay only: the always-on ones (Yidhari M2, Evelyn M2, Soldier 0 - Anby M2, Komano Manato M4, Seed M6, Nangong Yu M4, Promeia M2, Pyrois M1, Sigrid M1, Roxy M1) no longer count in the menu number \u2014 they're grayed like the rest, and the triggered ones keep their \u26a1.", "Kafka: Lv 60 base stats added (Base HP 7788, Base ATK 797, Base DEF 612, Base Impact 86, CRIT Rate 5%, CRIT DMG 50%, Anomaly Mastery 112, Anomaly Proficiency 114, PEN Ratio 0%, Base Energy Regen 1.2) with Base ATK, Anomaly Proficiency and Base Energy Regen highlighted like in game. Her Core Passive \u201cKafka's Anomaly Proficiency increases by 84\u201d is shown grayed (gameplay). Her Additional Ability is in too: if her initial Energy Regen exceeds 1.2, every 0.12 above it gives +10 Anomaly Mastery, up to +140, for 30s \u2014 grayed and marked \u26a1. Core Skill bonuses still to come.", "Remielle's Additional Ability is in: with 1/2/3 Anomaly characters in the squad, everyone gains ATK equal to 6%/12%/40% of Remielle's initial ATK (max 1,600) on entering the battlefield. Her card (Builder and Full view) has a new \u201cAnomaly characters in squad: 0 1 2 3\u201d toggle (default 3) that changes the grayed \u26a1 ATK; the choice is saved with the build.", "Ukinami Yuzuha: her Core Passive Tanuki Wish is in \u2014 after her EX Special Attack or Ultimate hits, all squad members (her included) gain ATK equal to 40% of Yuzuha's initial ATK, up to 1,200. Shown grayed and marked \u26a1.", "Banyue: his Core Passive is in \u2014 after an EX Special Attack or Assist Follow-Up he gains +300 Sheer Force and +36% CRIT DMG, shown grayed and marked \u26a1 (the +36% Fire DMG isn't a stat-panel stat, so it's left out)."]},
  {date:"2026-11-04",ver:"5.1.0-draft",items:["New version format: MAJOR.MINOR.PATCH, no zero-padding. MAJOR = a redesign or a change to how saves are kept, MINOR = a new feature, PATCH = a fix or small tweak.","This copy is a draft: it shows the next site version plus \"-draft\" and only becomes 5.1.0 when it goes on the site (the site is on 5.0.2). Side experiments get \"-exp.1\", \"-exp.2\"... instead of their own numbers.","Note: 4.89.0 to 4.99.9 below were draft builds made here, not site releases. The site used 4.89 and 4.90 for different changes (online saving, which is now 5.0.0, and Robin/Sunbringer Mindscape text, now 5.0.1)."]},
  {date:"2026-11-04",ver:"4.99.9",tag:"Content",items:["Added Severian Lowell's Lv 60 base stats (in-game order; Base ATK, CRIT Rate and CRIT DMG highlighted)."]},
  {date:"2026-11-03",ver:"4.99.8",tag:"Fix",items:["Max HP now rounds up instead of down. Checked against the game: a Promeia build works out to 11389.84 and the game shows 11390. Provisional \u2014 to be rechecked against a build whose fraction is below .5."]},
  {date:"2026-11-03",ver:"4.99.7",tag:"Content",items:["Added Promeia's Core Skill (F): A, B, C give +12 Anomaly Mastery each and D, E, F give +25 ATK each (both raise her base stats)."]},
  {date:"2026-11-03",ver:"4.99.6",tag:"Content",items:["Added Promeia's Anomaly Mastery \u2192 Anomaly Proficiency conversion: when her initial Anomaly Mastery exceeds 150, each additional point increases her Anomaly Proficiency by 1.5 (shown as a grayed bonus, like Norma's conversion; rounded down)."]},
  {date:"2026-11-03",ver:"4.99.5",tag:"Content",items:["Added Promeia's Lv 60 base stats (in-game order; Base ATK, Anomaly Mastery and Anomaly Proficiency highlighted)."]},
  {date:"2026-11-03",ver:"4.99.4",tag:"Fix",items:["Fixed Sunna's highlighted stats: Anomaly Proficiency is no longer highlighted (only Base ATK and Base Energy Regen are, as in the game)."]},
  {date:"2026-11-03",ver:"4.99.3",tag:"Content",items:["Added Sunna's Core Skill (F): A, B, C give +7% ATK each (+21% total, added with her other ATK % bonuses) and D, E, F give +25 ATK each (raises her base ATK)."]},
  {date:"2026-11-03",ver:"4.99.2",tag:"Content",items:["Added Sunna's Lv 60 base stats (in-game order; Base ATK, Anomaly Proficiency and Base Energy Regen highlighted)."]},
  {date:"2026-11-03",ver:"4.99.1",tag:"Content",items:["Added Remielle Dan's Core Skill (F): A, B, C give +18 Anomaly Proficiency each and D, E, F give +25 ATK each (ATK raises her base stat)."]},
  {date:"2026-11-03",ver:"4.99.0",tag:"Feature",items:["Added the Crimson Wing Nocturne 4-piece bonus: +30% CRIT DMG when CRIT Rate is at least 50%.","Norma Hollowell\u2019s CRIT Rate \u2192 CRIT DMG conversion and the 4-piece bonus are now treated like W-Engine passives: the solid CRIT DMG is what the game menu shows, and the grayed value beside it (\u201cwith | solid\u201d) includes them. Checked against the game: her build\u2019s menu CRIT DMG is 107.6% and the bonuses add +115% (85% conversion + 30% set)."]},
  {date:"2026-11-03",ver:"4.98.8",tag:"Content",items:["Named two Drive Disc sets that were showing only their ID: ID 343 is Rank Stele (2-piece DEF +16%) and ID 344 is Crimson Wing Nocturne (2-piece Energy Regen +20%). Their set bonuses now count in the stat calculator under those names."]},
  {date:"2026-11-03",ver:"4.98.7",tag:"Fix",items:["Build card: the Mindscape badge (M0\u2013M6) no longer has a box around it \u2014 just the text, with a soft shadow so it stays readable over the art."]},
  {date:"2026-11-03",ver:"4.98.6",tag:"Content",items:["Added Norma Hollowell's Core Skill (F): A, B, C give +4.8% CRIT Rate each and D, E, F give +25 ATK each (same as Yidhari)."]},
  {date:"2026-11-03",ver:"4.98.5",tag:"Content",items:["Added Norma Hollowell's CRIT conversion: when her initial CRIT Rate exceeds 50%, every additional 1% increases her CRIT DMG by 1.7%, up to a maximum increase of 85%."]},
  {date:"2026-11-03",ver:"4.98.4",tag:"Content",items:["Added Norma Hollowell's Lv 60 base stats (in-game order; CRIT Rate, CRIT DMG and Base Energy Regen highlighted)."]},
  {date:"2026-11-02",ver:"4.98.3",tag:"Content",items:["Added Sigrid de L'Azur\u2019s Core Skill (F): A, B, C give +4.8% CRIT Rate each and D, E, F give +25 ATK each (same as Yidhari and Banyue)."]},
  {date:"2026-11-02",ver:"4.98.2",tag:"Content",items:["Added Sigrid de L'Azur\u2019s Lv 60 base stats (in-game order; Base ATK, CRIT Rate, CRIT DMG and PEN Ratio highlighted)."]},
  {date:"2026-11-02",ver:"4.98.1",tag:"Fix",items:["Stats with a W-Engine passive now show as \u201cwith passive | solid\u201d (e.g. 80.2% | 60.2%), with the grayed passive value first."]},
  {date:"2026-11-02",ver:"4.98.0",tag:"Feature",items:["W-Engine passive stat bonuses (like Wrathful Vajra\u2019s +20% CRIT Rate) no longer count in the solid number. The stat now shows its value without the passive, with a grayed-out arrow value beside it showing the total with the passive active, and the passive\u2019s Stat sources box is grayed out."]},
  {date:"2026-11-02",ver:"4.97.7",tag:"Content",items:["Added Remielle Dan\u2019s Lv 60 base stats (in-game order; Base ATK and Anomaly Proficiency highlighted)."]},
  {date:"2026-11-02",ver:"4.97.6",tag:"Content",items:["Added Banyue\u2019s Core Skill (F): A, B, C give +4.8% CRIT Rate each and D, E, F give +25 ATK each (same as Yidhari)."]},
  {date:"2026-11-02",ver:"4.97.5",tag:"Content",items:["Added Banyue\u2019s Lv 60 base stats (in-game order; Base HP, CRIT Rate, CRIT DMG and Sheer Force highlighted).","The Sheer Force conversion (0.1 per Max HP + 0.3 per ATK, each rounded down) is now a Rupture rule that applies automatically to any character whose base stats include Sheer Force, so it covers Banyue as well as Yidhari."]},
  {date:"2026-11-02",ver:"4.97.4",tag:"Fix",items:["Fixed Yidhari Murphy\u2019s Sheer Force: it is now 0.1 per Max HP plus 0.3 per ATK, each part rounded down before adding (checked against the game: 22589 HP and 1935 ATK = 2258 + 580 = 2838). Replaces the round-up from v4.97.3."]},
  {date:"2026-11-02",ver:"4.97.3",tag:"Fix",items:["Yidhari Murphy\u2019s Sheer Force now rounds up instead of down (849.7 shows as 850)."]},
  {date:"2026-11-02",ver:"4.97.2",tag:"Content",items:["Added Yidhari Murphy\u2019s Core Skill (F): A, B, C give +4.8% CRIT Rate each and D, E, F give +25 ATK each (ATK raises her base stat)."]},
  {date:"2026-11-02",ver:"4.97.1",tag:"Content",items:["Added Yidhari Murphy\u2019s Sheer Force conversion: every 1 point of Max HP adds 0.1 Sheer Force. It uses her final Max HP, so HP from discs and her W-Engine raises it."]},
  {date:"2026-11-02",ver:"4.97.0",tag:"Feature",items:["Versioning cleaned up: numbers no longer zero-padded (4.96.6, not 4.96.06), PATCH counts up for small updates and MINOR only for real features, and every changelog entry is now tagged Content, Feature or Fix.","The site now shows the game version its data is for: 3.4.2 beta."]},
  {date:"2026-11-02",ver:"4.96.6",tag:"Content",items:["Added Yidhari Murphy\u2019s Lv 60 base stats to the build card."]},
  {date:"2026-11-02",ver:"4.96.5",tag:"Feature",items:["The Builder now opens on the Character section by default instead of Drive Disc."]},
  {date:"2026-11-02",ver:"4.96.4",tag:"Fix",items:["Reverted the full-width Stat sources layout from v4.96.3 \u2014 the list is back beside the picture with the compact boxes."]},
  {date:"2026-11-02",ver:"4.96.3",tag:"Feature",items:["Stat sources now spans the full width of the build card and lays its boxes out in columns (three on desktop), so the list is wide and short instead of long and narrow."]},
  {date:"2026-11-02",ver:"4.96.2",tag:"Content",items:["Added Ukinami Yuzuha's Core Skill (F): A, C, F give +12 Anomaly Mastery each and B, D, E give +25 ATK each (both raise her base stats)."]},
  {date:"2026-11-02",ver:"4.96.1",tag:"Content",items:["Added Ukinami Yuzuha's Lv 60 base stats (in-game order, Base ATK and Anomaly Mastery highlighted)."]},
  {date:"2026-11-02",ver:"4.96.0",tag:"Feature",items:["Picking the character, W-Engine or disc that's already selected now deselects it, clearing it back to empty."]},
  {date:"2026-11-02",ver:"4.95.3",tag:"Feature",items:["Stat sources: removed the faded look on boxes for stats that aren't on the character's panel \u2014 every box now shows at full brightness."]},
  {date:"2026-11-02",ver:"4.95.2",tag:"Feature",items:["Stat sources boxes are now abbreviated: stat names (HP, ATK, DEF, IMP, CR, CDMG, AM, AP, PEN, ER) and labels (main, subs, adv., 2pc, W1 passive, Core A\u2013F, CDMG conv.), so a full build fits in far fewer lines."]},
  {date:"2026-11-02",ver:"4.95.1",tag:"Content",items:["Added Vivian Banshee's Core Skill (F): A, C, E give +12 Anomaly Mastery each and B, D, F give +25 ATK each. Core bonuses to HP, ATK, DEF, Impact, Anomaly Mastery and Energy Regen now raise the base stat, so % bonuses multiply them too."]},
  {date:"2026-11-02",ver:"4.95.0",tag:"Content",items:["Claret Flint's base stats are now her absolute Lv 60 values (CRIT Rate 5%). Added Core Skill bonuses to the calculator (all calcs assume core level F): Claret gets CRIT Rate +4.8% \u00d7 6, shown as its own Stat sources box. Totals are unchanged \u2014 51.3% CRIT Rate with nothing equipped, matching the game."]},
  {date:"2026-11-02",ver:"4.94.3",tag:"Fix",items:["Corrected Vivian Banshee's base stats to her Lv 60 values (Base HP 7673, Base ATK 805, Base DEF 606) \u2014 the previous ones were level 1."]},
  {date:"2026-11-02",ver:"4.94.2",tag:"Content",items:["Added Vivian Banshee's base stats (in-game order, with Base ATK, Anomaly Mastery and Anomaly Proficiency highlighted). The calculator now also handles \u201cBase Energy Regen\u201d."]},
  {date:"2026-11-02",ver:"4.94.1",tag:"Feature",items:["Stat sources now combine like bonuses: all disc sub-stats of the same stat become one box (e.g. \u201c+72% ATK \u2014 sub-stats \u00b7 S1 \u00d76, S2 \u00d76, S3 \u00d76, S6 \u00d76\u201d), and the same for disc main stats (\u201c+60% ATK \u2014 main stats \u00b7 S4, S5\u201d). A full build goes from ~34 boxes to ~15."]},
  {date:"2026-11-02",ver:"4.94.0",tag:"Feature",items:["Build card: added a collapsible \u201cStat sources\u201d list under the stats. Each box shows one bonus and where it came from \u2014 e.g. \u201c+50.4% CRIT Rate \u2014 CRIT DMG conversion\u201d, \u201c+24% CRIT Rate \u2014 S4 Branch & Blade Song \u2014 main stat\u201d, \u201c+30% CRIT DMG \u2014 Severed Innocence \u2014 passive (W1)\u201d. Bonuses for stats that aren't on the character's panel (like ATK on Claret) are shown faded.","On phones, the green bonus now sits under the total so it doesn't spill out of the row."]},
  {date:"2026-11-02",ver:"4.93.0",tag:"Feature",items:["Added a \u201cNew build card\u201d on/off switch in the Saved tab's Drive Disc Set panel. The build card no longer depends on Experimental layout. It's on by default, and your choice is remembered; turning it off brings back the old Currently applied rows."]},
  {date:"2026-11-02",ver:"4.92.1",tag:"Content",items:["Added Claret Flint's CRIT conversion to the stat calculator: she gains 0.35% CRIT Rate for every 1% CRIT DMG (using total CRIT DMG after gear). With nothing equipped at core F her CRIT Rate now shows 51.3%, matching the game."]},

function clDateLabel(d){
  const dt=new Date(d+"T00:00:00");
  const label=dt.toLocaleDateString(undefined,{weekday:"short",year:"numeric",month:"short",day:"numeric"});
  return d<="2026-10-29"?label+" (reconstructed — approximate)":label;
}
function altDateForms(d){
  const [y,m,day]=d.split("-");
  const mi=+m,di=+day;
  return [`${mi}/${di}`,`${m}/${day}`,`${mi}/${di}/${y}`,`${m}/${day}/${y}`];
}
function renderChangelog(){
  const list=document.getElementById("changelogList");if(!list)return;
  const searchEl=document.getElementById("clSearch");
  const qRaw=(searchEl?searchEl.value:"").trim().toLowerCase();
  const groups=[];
  let cur=null;
  CHANGELOG.forEach(e=>{
    if(!cur||cur.date!==e.date){cur={date:e.date,entries:[]};groups.push(cur)}
    cur.entries.push(e);
  });
  const matches=e=>{
    if(!qRaw)return true;
    const hay=[e.date,clDateLabel(e.date),...altDateForms(e.date),e.ver,e.tag||"",...(e.items||[])].join(" ").toLowerCase();
    return hay.includes(qRaw);
  };
  let html="";
  groups.forEach(g=>{
    const entries=g.entries.filter(matches);
    if(!entries.length)return;
    html+=`<div class="cl-date">${esc(clDateLabel(g.date))}</div>`;
    entries.forEach(e=>{
      if(!e.group)html+=`<div class="cl-ver">v${esc(e.ver)}${e.tag?` <span class="cl-tag cl-${esc(e.tag.toLowerCase())}">${esc(e.tag)}</span>`:""}</div>`;
      html+=`<ul class="cl-list">${e.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;
    });
  });
  list.innerHTML=html||'<div class="cl-empty">No changelog entries match that search.</div>';
}
document.getElementById("clSearch").addEventListener("input",renderChangelog);
renderChangelog();
